<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funeral Home Registration — Dolenc</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f6f1e8;color:#1c1916;font:16px system-ui,sans-serif}header{padding:18px;border-bottom:1px solid #e4d9c8}a{color:#8a6a2f}main{max-width:650px;margin:38px auto;padding:20px}h1{font:43px Georgia,serif}form{background:#fffdf8;border:1px solid #e4d9c8;border-radius:18px;padding:24px;display:grid;gap:17px}label{display:grid;gap:7px;font-weight:650}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #c9bdab;border-radius:10px;font:inherit}button{background:#1c1916;color:white;border:0;border-radius:25px;padding:14px;font:inherit;cursor:pointer}button:disabled{opacity:.6}#status{color:#6b3d3d}.hint{color:#5c564e}</style></head><body><header><a href="/">← Dolenc.app</a></header><main><h1>Funeral Home Registration</h1><p class="hint">Register your funeral home for review. A Dolenc account is required. Registration does not mean the business is verified or publicly listed.</p><form id="registration" onsubmit="return false"><label>Funeral Home Name<input id="name" required maxlength="180" placeholder="Business name"></label><label>Street Address<input id="address" required maxlength="200" placeholder="Street address"></label><label>City<input id="city" required maxlength="100"></label><label>State<input id="state" required maxlength="40" value="CA"></label><label>ZIP Code<input id="zip" required pattern="[0-9]{5}(-[0-9]{4})?" placeholder="12345"></label><label>Phone Number<input id="phone" type="tel" required maxlength="30" placeholder="(555) 555-5555"></label><label>License Number<input id="license" required minlength="3" maxlength="80" placeholder="State funeral establishment license"></label><label>Contact Name<input id="contact" required maxlength="120"></label><button id="submit" type="button">Submit for Review</button><p id="status" role="status" aria-live="polite"></p></form></main><script>const client=window.supabase?.createClient?.('https://atxozpzesilcjwwglyvj.supabase.co','sb_publishable_QKzH7SMRP6E0H3tAZ-JeDA_TGy1mBT1');const form=document.getElementById('registration'),status=document.getElementById('status'),btn=document.getElementById('submit');btn.onclick=async()=>{if(!form.reportValidity())return;btn.disabled=true;status.textContent='Submitting…';try{if(!client)throw Error('Account service unavailable.');const {data,error}=await client.auth.getUser();if(error||!data.user){status.textContent='Please sign in before registering your funeral home.';const a=document.createElement('a');a.href='/auth.html?mode=signin';a.textContent=' Sign in';status.append(a);return;}const fields={business_name:document.getElementById('name').value.trim(),address:document.getElementById('address').value.trim(),city:document.getElementById('city').value.trim(),state:document.getElementById('state').value.trim(),zip:document.getElementById('zip').value.trim(),phone:document.getElementById('phone').value.trim(),license_number:document.getElementById('license').value.trim(),contact_name:document.getElementById('contact').value.trim()};const {error:saveError}=await client.from('funeral_homes').insert({...fields,user_id:data.user.id,email:data.user.email,verified:false,is_active:false});if(saveError)throw saveError;status.textContent='Registration submitted for review. Your listing is not yet public.';form.reset();}catch(e){status.textContent='Could not submit: '+(e.message||'Unknown error')}finally{btn.disabled=false}};</script></body></html>
