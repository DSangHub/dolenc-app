<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Send Condolences — Dolenc</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f6f1e8;color:#1c1916;font:16px system-ui,sans-serif}header{padding:18px;border-bottom:1px solid #e4d9c8}a{color:#8a6a2f}main{max-width:680px;margin:45px auto;padding:20px}h1{font:46px Georgia,serif}.card{background:#fffdf8;border:1px solid #e4d9c8;border-radius:18px;padding:25px}input{width:100%;padding:14px;box-sizing:border-box;border:1px solid #c9bdab;border-radius:10px;font:inherit;margin:10px 0}button{background:#1c1916;color:white;padding:13px 22px;border:0;border-radius:24px;cursor:pointer;font:inherit}#result{margin-top:20px}small{color:#665c50}</style></head><body><header><a href="/account.html">← My Dolenc Account</a></header><main><h1>Send Condolences</h1><p>Enter the event hashtag shared by the family to find their condolence page.</p><div class="card"><label for="hashtag"><strong>Enter the Hashtag</strong></label><input id="hashtag" placeholder="#dolenc-..." autocomplete="off" required><button id="find" type="button">Find Event</button><p id="message" role="status"></p><div id="result"></div></div></main><script>const client=window.supabase?.createClient?.('https://atxozpzesilcjwwglyvj.supabase.co','sb_publishable_QKzH7SMRP6E0H3tAZ-JeDA_TGy1mBT1');const msg=document.getElementById('message');const result=document.getElementById('result');async function find(){result.replaceChildren();const tag=document.getElementById('hashtag').value.trim().replace(/^#/,'').toLowerCase();if(!/^dolenc-[a-z0-9]{12}$/.test(tag)){msg.textContent='Enter a valid Dolenc event hashtag.';return;}if(!client){msg.textContent='Account service unavailable.';return;}const {data:auth}=await client.auth.getUser();if(!auth?.user){msg.textContent='Please sign in to find an event.';const a=document.createElement('a');a.href='/auth.html?mode=signin';a.textContent=' Sign in';msg.append(a);return;}msg.textContent='Searching…';const {data,error}=await client.from('condolence_events').select('title,description,amount_requested,ends_at').eq('hashtag',tag).maybeSingle();if(error){msg.textContent='Could not search events: '+error.message;return;}if(!data){msg.textContent='No event found for that hashtag.';return;}msg.textContent='Event found';const title=document.createElement('h2');title.textContent=data.title;const desc=document.createElement('p');desc.textContent=data.description;const amount=document.createElement('p');amount.textContent='Family request: $'+Number(data.amount_requested).toFixed(2);const end=document.createElement('small');end.textContent='Event ends: '+new Date(data.ends_at).toLocaleDateString();const note=document.createElement('p');note.textContent='Condolence message and payment sending are not yet available. No payment will be collected here.';result.append(title,desc,amount,end,note)}document.getElementById('find').addEventListener('click',find);document.getElementById('hashtag').addEventListener('keydown',e=>{if(e.key==='Enter')find()});</script></body></html>
