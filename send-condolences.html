sync function find(){result.replaceChildren();const tag=document.getElementById('hashtag').value.trim().replace(/^#/,'').toLowerCase();if(!/^dolenc-[a-z0-9]{12}$/.test(tag)){msg.textContent='Enter a valid Dolenc event hashtag.';return;}if(!client){msg.textContent='Account service unavailable.';return;}const {data:auth}=await client.auth.getUser();if(!auth?.user){msg.textContent='Please sign in to find an event.';const a=document.createElement('a');a.href='/auth.html?mode=signin';a.textContent=' Sign in';msg.append(a);return;}msg.textContent='Searching…';const {data,error}=await client.from('condolence_events').select('title,description,amount_requested,ends_at').eq('hashtag',tag).maybeSingle();if(error){msg.textContent='Could not search events: '+error.message;return;}if(!data){msg.textContent='No event found for that hashtag.';return;}msg.textContent='Event found';const title=document.createElement('h2');title.textContent=data.title;const desc=document.createElement('p');desc.textContent=data.description;const amount=document.createElement('p');amount.textContent='Family request: $'+Number(data.amount_requested).toFixed(2);const end=document.createElement('small');end.textContent='Event ends: '+new Date(data.ends_at).toLocaleDateString();const note=document.createElement('p');note.textContent='Condolence message and payment sending are not yet available. No payment will be collected here.';result.append(title,desc,amount,end,note)}document.getElementById('find').addEventListener('click',find);document.getElementById('hashtag').addEventListener('keydown',e=>{if(e.key==='Enter')find()});</script><script>window.dolencGoogleTranslateInit=function(){if(window.google&&google.translate&&google.translate.TranslateElement){new google.translate.TranslateElement({pageLanguage:'en',autoDisplay:false},'dolenc-google-translate');window.dolencTranslateReady=true;}};(function(){var picker=document.getElementById('dolenc-lang-select'),status=document.getElementById('dolenc-lang-status');if(!picker)return;var supported=Array.from(picker.options).map(function(o){return o.value});var stored=localStorage.getItem('dolenc_language');if(stored&&supported.includes(stored))picker.value=stored;function apply(lang){if(lang==='en'){document.cookie='googtrans=;Max-Age=0;path=/;SameSite=Lax';document.cookie='googtrans=;Max-Age=0;path=/;domain='+location.hostname+';SameSite=Lax';window.location.reload();return;}document.cookie='googtrans=/en/'+lang+';path=/;SameSite=Lax';document.cookie='googtrans=/en/'+lang+';path=/;domain='+location.hostname+';SameSite=Lax';var n=0;var poll=setInterval(function(){var combo=document.querySelector('select.goog-te-combo');if(combo){clearInterval(poll);combo.value=lang;combo.dispatchEvent(new Event('change',{bubbles:true}));status.textContent='';}else if(++n>30){clearInterval(poll);status.textContent='Translation unavailable. Try your browser Translate option.';}},200);}document.getElementById('dolenc-english').addEventListener('click',function(){localStorage.setItem('dolenc_language','en');picker.value='en';apply('en')});picker.addEventListener('change',function(){localStorage.setItem('dolenc_language',picker.value);apply(picker.value)});if(picker.value!=='en')apply(picker.value);})();</script><script src="https://translate.google.com/translate_a/element.js?cb=dolencGoogleTranslateInit" async></script></body></html>
