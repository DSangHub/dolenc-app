<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up / Sign in — Dolenc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --ink:#1c1916; --muted:#5c564e; --paper:#f6f1e8; --card:#fffdf8; --line:#e4d9c8; --gold:#8a6a2f; }
    * { box-sizing: border-box; margin:0; padding:0; }
    body { font-family: "Source Sans 3", system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height:1.5; }
    header { padding: 16px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    .brand { font-family:"Cormorant Garamond",serif; font-size:26px; }
    .brand span { color:var(--gold); }
    .wrap { max-width: 480px; margin: 40px auto; padding: 0 20px; }
    h1 { font-family:"Cormorant Garamond",serif; font-size:36px; margin-bottom:8px; }
    .tabs { display:flex; gap:8px; margin: 20px 0; }
    .tabs button { flex:1; padding:10px; border:1px solid var(--line); background:#fff; border-radius:10px; cursor:pointer; font-weight:600; }
    .tabs button.active { background:var(--ink); color:#fff; }
    form { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; display:grid; gap:12px; }
    label { font-size:14px; font-weight:600; }
    input, select, textarea { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font:inherit; }
    button#submitBtn { touch-action:manipulation; } button#submitBtn:disabled { opacity:.65; cursor:wait; }
    button#submitBtn { background:var(--ink); color:#fff; border:0; padding:14px; border-radius:999px; font-weight:700; cursor:pointer; font-size:16px; }
    .password-wrap { position:relative; }
    .password-wrap input { padding-right:54px; }
    #togglePassword { position:absolute; right:8px; top:50%; transform:translateY(-50%); display:grid; place-items:center; width:40px; height:40px; border:0; background:transparent; color:var(--muted); cursor:pointer; border-radius:8px; }
    #togglePassword:focus-visible { outline:2px solid var(--gold); }
    .note { font-size:13px; color:var(--muted); margin-top:12px; text-align:center; }
    .error { color:#9b2c2c; font-size:14px; }
    .success { color:#276749; font-size:14px; }
    .extra { display:none; }
    .extra.show { display:block; }
    [hidden] { display:none !important; }
  </style>
</head>
<body><div id="dolenc-language" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;background:#fffdf8;border-bottom:1px solid #e4d9c8;position:relative;z-index:40"><label for="dolenc-lang-select" style="font:600 13px system-ui,sans-serif">🌐 Language</label><select id="dolenc-lang-select" aria-label="Translate website language" style="max-width:220px;padding:7px;border:1px solid #c9bdab;border-radius:8px;background:white;color:#1c1916;font:14px system-ui,sans-serif"><option value="en">English (Default)</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="pt">Português</option><option value="zh-CN">中文 (简体)</option><option value="zh-TW">中文 (繁體)</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="hi">हिन्दी</option><option value="ur">اردو</option><option value="pa">ਪੰਜਾਬੀ</option><option value="id">Bahasa Indonesia</option><option value="ar">العربية</option><option value="ru">Русский</option><option value="vi">Tiếng Việt</option><option value="tl">Filipino</option><option value="th">ไทย</option><option value="tr">Türkçe</option><option value="nl">Nederlands</option><option value="pl">Polski</option><option value="uk">Українська</option><option value="fa">فارسی</option><option value="bn">বাংলা</option><option value="ta">தமிழ்</option><option value="te">తెలుగు</option><option value="gu">ગુજરાતી</option><option value="mr">मराठी</option><option value="sw">Kiswahili</option><option value="he">עברית</option><option value="el">Ελληνικά</option><option value="ro">Română</option><option value="sv">Svenska</option><option value="no">Norsk</option><option value="da">Dansk</option><option value="fi">Suomi</option><option value="cs">Čeština</option><option value="hu">Magyar</option><option value="ms">Bahasa Melayu</option><option value="ne">नेपाली</option><option value="so">Soomaali</option><option value="am">አማርኛ</option><option value="hy">Հայերեն</option></select><button type="button" id="dolenc-english" translate="no" style="padding:7px 12px;border:1px solid #8a6a2f;border-radius:8px;background:#fffdf8;color:#1c1916;font:600 13px system-ui,sans-serif;cursor:pointer">English</button><span id="dolenc-lang-status" style="font:12px system-ui,sans-serif;color:#5c564e"></span><div id="dolenc-google-translate" style="position:absolute;left:-9999px;top:0"></div></div>
  <header>
    <a href="/" class="brand" style="text-decoration:none; color:inherit;">Dolenc<span>.</span>app</a>
    <a href="/" style="color:var(--ink); text-decoration:none;">← Back</a>
  </header>

  <div class="wrap" id="authWrap">
    <h1>Sign up / Sign in</h1>
    <p style="color:var(--muted); margin-bottom:8px;">Choose your account type. Funeral Homes and Card Sellers get their own profiles.</p>

    <div class="tabs">
      <button type="button" class="active" data-role="user">User</button>
      <button type="button" data-role="funeral_home">Funeral Home</button>
      <button type="button" data-role="card_seller">Card Seller</button>
    </div>

    <form id="authForm" method="post" onsubmit="event.preventDefault(); return false;">
      <input type="hidden" id="role" value="user" />

      <div>
        <label>Full name / Contact name</label>
        <input id="full_name" required placeholder="Jane Doe" />
      </div>

      <div class="extra" id="bizFields">
        <label>Business name</label>
        <input id="business_name" placeholder="Peaceful Rest Funeral Home" />
        <label>Phone</label>
        <input id="phone" placeholder="555-123-4567" />
        <label>Website (optional)</label>
        <input id="website" placeholder="https://..." />
      </div>

      <div>
        <label>Email</label>
        <input id="email" type="email" required placeholder="you@example.com" />
      </div>
      <div>
        <label>Password</label>
        <div class="password-wrap"><input id="password" type="password" required minlength="6" placeholder="At least 6 characters" /><button type="button" id="togglePassword" aria-label="Show password" aria-pressed="false" title="Show password"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      </div>

      <button type="button" id="submitBtn" onclick="if(window.dolencSubmitAccount){window.dolencSubmitAccount(event)}else{document.getElementById('msg').textContent='Signup script failed to load. Please refresh.'}">Create account</button>
      <div id="msg" role="status" aria-live="polite"></div>
    </form>

    <div id="signedInPanel" class="card" hidden style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:18px"><h2>You're signed in</h2><p id="signedInEmail"></p><p>What would you like to do?</p><p><a href="/account.html#create-event" style="display:block;padding:12px;margin:8px 0;background:#8a6a2f;color:white;border-radius:10px;text-align:center">Create an Event</a><a href="/account.html#send-condolences" style="display:block;padding:12px;margin:8px 0;background:#1c1916;color:white;border-radius:10px;text-align:center">Send Condolences</a></p><button type="button" id="signOutBtn" style="padding:10px 18px;cursor:pointer">Sign out</button></div>
    <p class="note" id="modeNote">Already have an account? <a href="#" id="toggleMode" style="color:var(--gold); font-weight:700;">Sign in instead</a></p>
  </div>

  <script>
    const SUPABASE_URL = 'https://atxozpzesilcjwwglyvj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_QKzH7SMRP6E0H3tAZ-JeDA_TGy1mBT1'; // ← replace with your project anon/public key

    const dolencClient = window.supabase?.createClient?.(SUPABASE_URL, SUPABASE_ANON_KEY);

    const passwordField = document.getElementById('password');
    const passwordToggle = document.getElementById('togglePassword');
    passwordToggle.addEventListener('click', () => {
      const visible = passwordField.type === 'password';
      passwordField.type = visible ? 'text' : 'password';
      passwordToggle.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
      passwordToggle.setAttribute('aria-pressed', String(visible));
      passwordToggle.title = visible ? 'Hide password' : 'Show password';
    });
    const tabs = document.querySelectorAll('.tabs button');
    const roleInput = document.getElementById('role');
    const bizFields = document.getElementById('bizFields');
    const form = document.getElementById('authForm');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');
    const toggleMode = document.getElementById('toggleMode');
    let isSignup = true;
    const signedInPanel = document.getElementById('signedInPanel');
    function showSignedIn(user) {
      form.hidden = true;
      document.querySelector('.tabs').hidden = true;
      document.getElementById('modeNote').hidden = true;
      signedInPanel.hidden = false;
      document.getElementById('signedInEmail').textContent = user.email || '';
      document.querySelector('.wrap h1').textContent = 'Welcome to Dolenc';
    }
    document.getElementById('signOutBtn').addEventListener('click', async () => {
      if (dolencClient) await dolencClient.auth.signOut();
      window.location.href = '/auth.html?mode=signin';
    });
    function setMode(signup) {
      isSignup = signup;
      submitBtn.textContent = signup ? 'Create account' : 'Sign in';
      toggleMode.textContent = signup ? 'Sign in instead' : 'Create an account';
      document.getElementById('full_name').required = signup;
      document.getElementById('full_name').parentElement.hidden = !signup;
      bizFields.hidden = !signup || roleInput.value === 'user';
      document.querySelector('.wrap h1').textContent = signup ? 'Create account' : 'Sign in';
      msg.textContent = '';
    }
    if (new URLSearchParams(location.search).get('mode') === 'signin') setMode(false);
    if (dolencClient) dolencClient.auth.getUser().then(({data}) => { if (data?.user) window.location.replace('/account.html'); }).catch(() => {});


    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        tabs.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const role = btn.dataset.role;
        roleInput.value = role;
        bizFields.classList.toggle('show', role !== 'user');
      });
    });

    toggleMode.addEventListener('click', (e) => { e.preventDefault(); setMode(!isSignup); });

    const withTimeout = (promise) => Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('Connection timed out. Please try again.')), 15000))]);
    submitBtn.addEventListener('pointerdown', () => {
      if (!form.checkValidity()) {
        msg.textContent = 'Please complete all required fields. Password must be at least 6 characters.';
        msg.className = 'error';
        form.reportValidity();
      } else {
        msg.textContent = 'Connecting to Dolenc account service…';
        msg.className = 'success';
      }
    });
    async function submitAccount(e) {
      if (e) e.preventDefault();
      if (!form.reportValidity()) { msg.textContent = 'Please complete all required fields.'; msg.className = 'error'; return; }
      msg.textContent = 'Connecting to Dolenc account service…';
      msg.className = 'success';
      submitBtn.disabled = true;
      submitBtn.textContent = isSignup ? 'Creating…' : 'Signing in…';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = roleInput.value;
      const full_name = document.getElementById('full_name').value;
      const business_name = document.getElementById('business_name').value;
      const phone = document.getElementById('phone').value;
      const website = document.getElementById('website').value;

      try {
        if (isSignup) {
          if (!dolencClient) throw new Error('Authentication could not load. Refresh this page and try again.');
          const { data, error } = await withTimeout(dolencClient.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name,
                business_name: business_name || full_name,
                phone,
                website,
                role
              }
            }
          }));
          if (error) throw error;
          if (data.user && data.session) {
            const { error: profileError } = await dolencClient.from('users').upsert({ id: data.user.id, email, full_name, phone, role }, { onConflict: 'id' });
            if (profileError) throw profileError;
          }
          msg.textContent = data.session ? 'Account created. You can now sign in.' : 'Check your email to confirm the account. Once confirmed, sign in here.';
          msg.className = 'success';
        } else {
          if (!dolencClient) throw new Error('Authentication could not load. Refresh this page and try again.');
          const { error } = await withTimeout(dolencClient.auth.signInWithPassword({ email, password }));
          if (error) throw error;
          const { data: { user } } = await dolencClient.auth.getUser();
          const { data: existingProfile } = await dolencClient.from('users').select('role').eq('id', user.id).maybeSingle();
          if (!existingProfile) {
            const meta = user.user_metadata || {};
            const allowedRoles = ['user', 'funeral_home', 'card_seller'];
            const safeRole = allowedRoles.includes(meta.role) ? meta.role : 'user';
            const { error: profileError } = await dolencClient.from('users').insert({ id: user.id, email: user.email, full_name: meta.full_name || '', phone: meta.phone || '', role: safeRole });
            if (profileError) throw new Error('Signed in, but profile setup failed: ' + profileError.message);
          }
          const profile = existingProfile;
          const r = profile?.role || 'user';
          window.location.href = '/account.html';
        }
      } catch (err) {
        msg.textContent = err?.message || 'Account request failed. Please try again.';
        msg.className = 'error';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = isSignup ? 'Create account' : 'Sign in';
      }
    }
    window.dolencSubmitAccount = submitAccount;
    form.addEventListener('submit', submitAccount);
  </script>
<script>window.dolencGoogleTranslateInit=function(){if(window.google&&google.translate&&google.translate.TranslateElement){new google.translate.TranslateElement({pageLanguage:'en',autoDisplay:false},'dolenc-google-translate');window.dolencTranslateReady=true;}};(function(){var picker=document.getElementById('dolenc-lang-select'),status=document.getElementById('dolenc-lang-status');if(!picker)return;var supported=Array.from(picker.options).map(function(o){return o.value});var stored=localStorage.getItem('dolenc_language');if(stored&&supported.includes(stored))picker.value=stored;function apply(lang){if(lang==='en'){document.cookie='googtrans=;Max-Age=0;path=/;SameSite=Lax';document.cookie='googtrans=;Max-Age=0;path=/;domain='+location.hostname+';SameSite=Lax';window.location.reload();return;}document.cookie='googtrans=/en/'+lang+';path=/;SameSite=Lax';document.cookie='googtrans=/en/'+lang+';path=/;domain='+location.hostname+';SameSite=Lax';var n=0;var poll=setInterval(function(){var combo=document.querySelector('select.goog-te-combo');if(combo){clearInterval(poll);combo.value=lang;combo.dispatchEvent(new Event('change',{bubbles:true}));status.textContent='';}else if(++n>30){clearInterval(poll);status.textContent='Translation unavailable. Try your browser Translate option.';}},200);}document.getElementById('dolenc-english').addEventListener('click',function(){localStorage.setItem('dolenc_language','en');picker.value='en';apply('en')});picker.addEventListener('change',function(){localStorage.setItem('dolenc_language',picker.value);apply(picker.value)});if(picker.value!=='en')apply(picker.value);})();</script><script src="https://translate.google.com/translate_a/element.js?cb=dolencGoogleTranslateInit" async></script></body>
</html>
