ce('/auth.html?mode=signin');return;}document.getElementById('status').textContent='Signed in as '+data.user.email;document.getElementById('choices').hidden=false;document.getElementById('signout').hidden=false;}catch(e){document.getElementById('status').textContent=e.message||'Could not load account.';}}document.getElementById('signout').onclick=async()=>{if(client)await client.auth.signOut();location.replace('/auth.html?mode=signin')};init();</script></body></html>
